apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fileflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.3.3
        ports:
          - containerPort: 3000
        env:
          - name: GF_SECURITY_ADMIN_PASSWORD
            value: "admin"
          - name: GF_USERS_ALLOW_SIGN_UP
            value: "false"
        volumeMounts:
          - name: datasource-volume
            mountPath: /etc/grafana/provisioning/datasources
        resources:
          requests:
            cpu: "50m"
            memory: "100Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      volumes:
        - name: datasource-volume
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: fileflow
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP