apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileflow-worker
  namespace: fileflow
  labels:
    app: fileflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fileflow-worker
  template:
    metadata:
      labels:
        app: fileflow-worker
    spec:
      containers:
      - name: worker
        image: fileflow-worker:v1
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: fileflow-config
        - secretRef:
            name: fileflow-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"